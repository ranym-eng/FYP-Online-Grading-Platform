spring:
  application:
    name: fyp-grading-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fyp_grading_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@squ.edu.om}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  auth:
    local-internal-login-enabled: ${LOCAL_INTERNAL_LOGIN_ENABLED:false}
    industry-invitation-hours: ${INDUSTRY_INVITATION_HOURS:48}
    sso:
      enabled: ${SQU_SSO_ENABLED:false}
      registration-id: squ
      client-id: ${SQU_SSO_CLIENT_ID:}
      client-secret: ${SQU_SSO_CLIENT_SECRET:}
      issuer-uri: ${SQU_SSO_ISSUER_URI:}
      scopes: ${SQU_SSO_SCOPES:openid,profile,email}
      email-claim: ${SQU_SSO_EMAIL_CLAIM:email}
      allowed-domain: ${SQU_SSO_ALLOWED_DOMAIN:squ.edu.om}
  security:
    token-secret: ${APP_TOKEN_SECRET:}
    token-lifetime-seconds: ${APP_TOKEN_LIFETIME_SECONDS:28800}
    allow-email-token: ${APP_ALLOW_EMAIL_TOKEN:false}
  reports:
    output-dir: ${REPORT_OUTPUT_DIR:generated}
