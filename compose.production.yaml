name: fyp-online-grading-platform-production

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    mem_limit: 64m

  backend:
    image: ghcr.io/ranym-eng/fyp-grading-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@squ.edu.om}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-false}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-false}
      MAIL_HEALTH_ENABLED: "false"
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET:?APP_TOKEN_SECRET is required}
      APP_FRONTEND_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      LOCAL_INTERNAL_LOGIN_ENABLED: ${LOCAL_INTERNAL_LOGIN_ENABLED:-true}
      INDUSTRY_INVITATION_HOURS: ${INDUSTRY_INVITATION_HOURS:-48}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
      SQU_SSO_ENABLED: ${SQU_SSO_ENABLED:-false}
      SQU_SSO_CLIENT_ID: ${SQU_SSO_CLIENT_ID:-}
      SQU_SSO_CLIENT_SECRET: ${SQU_SSO_CLIENT_SECRET:-}
      SQU_SSO_ISSUER_URI: ${SQU_SSO_ISSUER_URI:-}
      SQU_SSO_SCOPES: ${SQU_SSO_SCOPES:-openid,profile,email}
      SQU_SSO_EMAIL_CLAIM: ${SQU_SSO_EMAIL_CLAIM:-email}
      SQU_SSO_ALLOWED_DOMAIN: ${SQU_SSO_ALLOWED_DOMAIN:-squ.edu.om}
      REPORT_OUTPUT_DIR: /app/generated
    volumes:
      - report_data:/app/generated
    mem_limit: 640m
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  frontend:
    image: ghcr.io/ranym-eng/fyp-grading-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  report_data:
  caddy_data:
  caddy_config:
