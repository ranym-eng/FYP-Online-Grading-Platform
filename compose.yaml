name: fyp-online-grading-platform

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fyp_grading_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fyp_grading_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@squ.edu.om}
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS_ENABLE: "false"
      MAIL_HEALTH_ENABLED: "false"
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET:-}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      LOCAL_INTERNAL_LOGIN_ENABLED: ${LOCAL_INTERNAL_LOGIN_ENABLED:-true}
      INDUSTRY_INVITATION_HOURS: ${INDUSTRY_INVITATION_HOURS:-48}
      SQU_SSO_ENABLED: ${SQU_SSO_ENABLED:-false}
      SQU_SSO_CLIENT_ID: ${SQU_SSO_CLIENT_ID:-}
      SQU_SSO_CLIENT_SECRET: ${SQU_SSO_CLIENT_SECRET:-}
      SQU_SSO_ISSUER_URI: ${SQU_SSO_ISSUER_URI:-}
      SQU_SSO_SCOPES: ${SQU_SSO_SCOPES:-openid,profile,email}
      SQU_SSO_EMAIL_CLAIM: ${SQU_SSO_EMAIL_CLAIM:-email}
      SQU_SSO_ALLOWED_DOMAIN: ${SQU_SSO_ALLOWED_DOMAIN:-squ.edu.om}
      REPORT_OUTPUT_DIR: /app/generated
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:8080/actuator/health | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
